<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Authenticity Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --light: #f8f9fa;
            --dark: #212529;
            --danger: #f72585;
            --warning: #f8961e;
            --info: #4895ef;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: var(--dark);
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            font-weight: 300;
            opacity: 0.9;
        }
        
        .content {
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }
        
        textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 150px;
            transition: all 0.3s ease;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        
        .btn {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .result-container {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            background: #f8f9fa;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .show-result {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .result-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            color: white;
            font-size: 1.2rem;
        }
        
        .original {
            background: var(--success);
        }
        
        .generated {
            background: var(--danger);
        }
        
        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .confidence {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 0.5rem;
            background: rgba(0, 0, 0, 0.05);
        }
        
        .review-text {
            margin-top: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
        
        footer {
            text-align: center;
            margin-top: 2rem;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .container {
                border-radius: 10px;
            }
            
            header {
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Review Authenticity Detector</h1>
            <p class="subtitle">Detect whether a review was written by a human or generated by AI</p>
        </header>
        
        <div class="content">
            <form method="POST">
                <div class="form-group">
                    <label for="review">Enter your review text:</label>
                    <textarea id="review" name="review" placeholder="Paste the review text here..." required>{% if result %}{{ result.text }}{% endif %}</textarea>
                </div>
                <button type="submit" class="btn">
                    <i class="fas fa-search"></i> Analyze Review
                </button>
            </form>
            
            {% if result %}
            <div class="result-container show-result">
                <div class="result-header">
                    <div class="result-icon {% if result.label == 'Original Review (OR)' %}original{% else %}generated{% endif %}">
                        <i class="fas {% if result.label == 'Original Review (OR)' %}fa-user{% else %}fa-robot{% endif %}"></i>
                    </div>
                    <div>
                        <h3 class="result-title">{{ result.label }}</h3>
                        <span class="confidence">Confidence: {{ result.confidence }}</span>
                    </div>
                </div>
                
                <div class="review-text">
                    <p>{{ result.text }}</p>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
    
    <footer>
        <p>Powered by DistilBERT AI Model | Review Authenticity Detection System</p>
    </footer>
</body>
</html>
